<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ukraine War Footage Map</title>
<meta name="description" content="Interactive timeline map of geolocated footage from the Russia-Ukraine war, with front-line changes since 2022.">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { --bg:#0e1116; --panel:rgba(18,22,29,.92); --fg:#e6e9ef; --muted:#9aa3b2; --accent:#ffd34d; --line:#2a313c; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #map { position:absolute; inset:0; }
  .panel { position:absolute; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; backdrop-filter: blur(6px); }
  #info { top:12px; left:12px; width:290px; max-height:calc(100% - 150px); overflow:auto; }
  #info h1 { font-size:16px; margin:0 0 4px; }
  #info p { margin:0 0 10px; color:var(--muted); font-size:12px; }
  #legend label { display:flex; align-items:center; gap:8px; padding:2px 0; cursor:pointer; font-size:13px; }
  .sw { width:11px; height:11px; border-radius:50%; flex:none; }
  .sq { width:12px; height:12px; border-radius:2px; flex:none; }
  .row { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:13px; }
  #timeline { left:12px; right:12px; bottom:28px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; }
  #date { font-size:20px; font-weight:600; min-width:120px; font-variant-numeric:tabular-nums; color:var(--accent); }
  #slider { flex:1 1 300px; accent-color:var(--accent); }
  button, select { background:#1f2630; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #count { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .maplibregl-popup-content { background:#151a21; color:var(--fg); padding:12px; border-radius:8px; max-width:360px; }
  .maplibregl-popup-tip { border-top-color:#151a21 !important; border-bottom-color:#151a21 !important; }
  .maplibregl-popup-close-button { color:var(--fg); font-size:18px; }
  .pop-date { color:var(--accent); font-weight:600; }
  .pop-meta { color:var(--muted); font-size:12px; margin:2px 0 8px; }
  .pop-text { margin:0 0 10px; }
  .warn { background:#3a2a10; border:1px solid #7a5a1a; border-radius:6px; padding:8px; font-size:12px; margin-bottom:8px; }
  .embed { width:320px; max-width:100%; }
  .embed iframe { width:100%; aspect-ratio:16/9; border:0; }
  a { color:#7cb7ff; }
  @media (max-width:640px) {
    #info { width:auto; right:12px; max-height:38%; }
    #info.collapsed #legend, #info.collapsed .opts, #info.collapsed p { display:none; }
    #timeline { left:8px; right:8px; bottom:24px; padding:10px; }
    #date { font-size:16px; min-width:0; }
    .maplibregl-popup-content { max-width:calc(100vw - 40px); }
  }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of geolocated war footage"></div>

<section id="info" class="panel">
  <h1 id="toggleInfo" tabindex="0" role="button" aria-expanded="true">Ukraine War: Geolocated Footage</h1>
  <p>Verified, geolocated posts since 24 Feb 2022. Click a point to load the original video. <strong>Some footage is graphic.</strong></p>
  <div id="legend" aria-label="Categories"></div>
  <div class="opts">
    <div class="row"><input type="checkbox" id="hideGraphic"><label for="hideGraphic">Hide severe/graphic entries</label></div>
    <div class="row"><input type="checkbox" id="showFront" checked><label for="showFront">Front line (DeepStateMap)</label></div>
    <div class="row"><span class="sq" style="background:#d6453d"></span>Occupied <span class="sq" style="background:#9e9e9e;margin-left:8px"></span>Contested</div>
  </div>
</section>

<section id="timeline" class="panel" aria-label="Timeline">
  <button id="play" aria-label="Play timeline">▶</button>
  <span id="date" aria-live="polite">—</span>
  <input id="slider" type="range" min="0" max="0" value="0" aria-label="Date">
  <select id="mode" aria-label="Time window">
    <option value="30">±30 days</option>
    <option value="7">±7 days</option>
    <option value="all">Cumulative</option>
  </select>
  <span id="count"></span>
</section>

<script>
const START = Date.UTC(2022, 1, 24), DAY = 864e5;
const dayOf = d => Math.round((Date.parse(d) - START) / DAY);
const dateOf = n => new Date(START + n * DAY).toISOString().slice(0, 10);

const CATS = [
  ['Russian Military Losses', '#ffd34d'],
  ['Ground Battle', '#ff7a1a'],
  ['Russian Military Presence', '#e8523f'],
  ['Russian Firing Positions', '#c2185b'],
  ['Munitions', '#b388ff'],
  ['Military Infrastructure Damage', '#8d6e63'],
  ['Bombing or explosion', '#ff4081'],
  ['Civilian Infrastructure Damage', '#4fc3f7'],
  ['Civilian Casualty', '#80deea'],
  ['Other', '#9e9e9e'],
];
const OTHER = '#9e9e9e';
const colorExpr = ['match', ['get', 'c'], ...CATS.flatMap(([k, c]) => [k, c]), OTHER];
const enabled = new Set(CATS.map(c => c[0]));
const known = new Set(CATS.map(c => c[0]));

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  center: [34.5, 48.4], zoom: 5.3, maxPitch: 70, attributionControl: false,
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
map.addControl(new maplibregl.AttributionControl({ compact: true, customAttribution:
  'Footage: <a href="https://www.info-res.org/eyes-on-russia/">CIR Eyes on Russia</a> · Front line: <a href="https://deepstatemap.live">DeepStateMap.live</a> · Terrain: Mapzen/AWS' }));

let events = [], frontMonths = [], frontCache = new Map(), day = 0;

map.on('load', async () => {
  // Terrain shading gives the "landscape" look under the dark basemap.
  map.addSource('dem', { type: 'raster-dem', encoding: 'terrarium', tileSize: 256, maxzoom: 13,
    tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'] });
  const firstSymbol = map.getStyle().layers.find(l => l.type === 'symbol')?.id;
  map.addLayer({ id: 'hillshade', type: 'hillshade', source: 'dem',
    paint: { 'hillshade-exaggeration': 0.45, 'hillshade-shadow-color': '#000', 'hillshade-highlight-color': '#3a4350' } }, firstSymbol);

  map.addSource('front', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'front-fill', type: 'fill', source: 'front',
    paint: { 'fill-color': ['match', ['get', 'k'], 'occupied', '#d6453d', '#9e9e9e'], 'fill-opacity': 0.22 } }, firstSymbol);
  map.addLayer({ id: 'front-line', type: 'line', source: 'front',
    paint: { 'line-color': ['match', ['get', 'k'], 'occupied', '#ff6b5e', '#bdbdbd'], 'line-width': 1.2 } }, firstSymbol);

  const [ev, months] = await Promise.all([
    fetch('data/events.geojson').then(r => r.json()),
    fetch('data/frontline/index.json').then(r => r.json()).catch(() => []),
  ]);
  frontMonths = months;
  for (const f of ev.features) {
    f.properties.n = dayOf(f.properties.d);
    if (!known.has(f.properties.c)) f.properties.c = 'Other';
  }
  events = ev.features;
  map.addSource('events', { type: 'geojson', data: ev });
  map.addLayer({ id: 'heat', type: 'heatmap', source: 'events', maxzoom: 9,
    paint: { 'heatmap-radius': ['interpolate', ['linear'], ['zoom'], 4, 6, 9, 18],
             'heatmap-intensity': ['interpolate', ['linear'], ['zoom'], 4, 0.6, 9, 1.4],
             'heatmap-opacity': ['interpolate', ['linear'], ['zoom'], 6, 0.85, 9, 0],
             'heatmap-color': ['interpolate', ['linear'], ['heatmap-density'],
               0, 'rgba(0,0,0,0)', 0.2, '#3b1c5a', 0.45, '#b33a3a', 0.7, '#ff8a1a', 1, '#ffe27a'] } });
  map.addLayer({ id: 'pts', type: 'circle', source: 'events',
    paint: { 'circle-color': colorExpr,
             'circle-radius': ['interpolate', ['linear'], ['zoom'], 4, 2.5, 10, 6, 14, 9],
             'circle-opacity': ['interpolate', ['linear'], ['zoom'], 5, 0.55, 8, 0.95],
             'circle-stroke-color': '#0e1116', 'circle-stroke-width': 0.6 } });

  const slider = document.getElementById('slider');
  slider.max = dayOf(new Date().toISOString().slice(0, 10));
  day = +slider.max;
  slider.value = day;
  buildLegend();
  update();

  map.on('click', 'pts', e => openPopup(e.features[0], e.lngLat));
  map.on('mouseenter', 'pts', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'pts', () => map.getCanvas().style.cursor = '');
});

function buildLegend() {
  const box = document.getElementById('legend');
  const counts = {};
  for (const f of events) counts[f.properties.c] = (counts[f.properties.c] || 0) + 1;
  for (const [name, color] of CATS) {
    if (!counts[name]) continue;
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = true;
    cb.onchange = () => { cb.checked ? enabled.add(name) : enabled.delete(name); update(); };
    const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = color;
    label.append(cb, sw, `${name} (${counts[name].toLocaleString()})`);
    box.append(label);
  }
}

function range() {
  const m = document.getElementById('mode').value;
  return m === 'all' ? [0, day] : [day - +m, day + +m];
}

function update() {
  if (!map.getLayer('pts')) return; // controls touched before data finished loading
  const [lo, hi] = range();
  const hideG = document.getElementById('hideGraphic').checked;
  const filter = ['all', ['>=', ['get', 'n'], lo], ['<=', ['get', 'n'], hi],
    ['in', ['get', 'c'], ['literal', [...enabled]]]];
  if (hideG) filter.push(['<', ['get', 'g'], 4]);
  map.setFilter('pts', filter);
  map.setFilter('heat', filter);
  const n = events.filter(f => { const p = f.properties;
    return p.n >= lo && p.n <= hi && enabled.has(p.c) && !(hideG && p.g >= 4); }).length;
  document.getElementById('date').textContent = dateOf(day);
  document.getElementById('count').textContent = `${n.toLocaleString()} posts shown`;
  updateFront();
}

let frontToken = 0;
async function updateFront() {
  const show = document.getElementById('showFront').checked;
  for (const id of ['front-fill', 'front-line']) map.setLayoutProperty(id, 'visibility', show ? 'visible' : 'none');
  if (!show || !frontMonths.length) return;
  const ym = dateOf(day).slice(0, 7);
  // Latest snapshot at or before this month (history starts Apr 2022).
  const m = [...frontMonths].reverse().find(x => x <= ym) || frontMonths[0];
  const token = ++frontToken;
  if (!frontCache.has(m)) frontCache.set(m, fetch(`data/frontline/${m}.geojson`).then(r => r.json()));
  const gj = await frontCache.get(m);
  if (token === frontToken) map.getSource('front').setData(gj);
}

// ---------- popup + click-to-load embeds ----------
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const GRAPHIC = ['', 'None', 'Mild', 'Moderate', 'Severe', 'Graphic'];

function openPopup(f, lngLat) {
  const p = f.properties;
  const box = el('div');
  box.append(el('div', 'pop-date', p.d));
  box.append(el('div', 'pop-meta', [p.c, p.p, p.s && `via ${p.s}`].filter(Boolean).join(' · ')));
  if (p.t) box.append(el('p', 'pop-text', p.t));
  const safeUrl = /^https?:\/\//i.test(p.u) ? p.u : null;
  const holder = el('div', 'embed');
  if (safeUrl) {
    const warn = el('div', 'warn', `Graphic content: ${GRAPHIC[p.g] || 'unknown'}. The video loads from ${new URL(safeUrl).hostname}.`);
    const btn = el('button', null, '▶ Load video');
    btn.onclick = () => { warn.remove(); btn.remove(); embed(safeUrl, holder); };
    const link = el('a', null, 'Open original ↗'); link.href = safeUrl; link.target = '_blank'; link.rel = 'noopener noreferrer';
    const row = el('div', 'row'); row.append(btn, link);
    holder.append(warn, row);
  }
  box.append(holder);
  new maplibregl.Popup({ maxWidth: '380px' }).setLngLat(lngLat).setDOMContent(box).addTo(map);
}

const loaded = {};
function loadScript(src) {
  return loaded[src] ||= new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = rej; document.head.append(s); });
}

function embed(url, holder) {
  const u = new URL(url);
  const host = u.hostname.replace(/^www\.|^m\./, '');
  let m;
  if (host === 't.me' && (m = u.pathname.match(/^\/(?:s\/)?([A-Za-z0-9_]{4,})\/(\d+)/))) {
    // Telegram's widget reads data attributes from its own script tag.
    const s = document.createElement('script');
    s.async = true; s.src = 'https://telegram.org/js/telegram-widget.js?22';
    s.dataset.telegramPost = `${m[1]}/${m[2]}`; s.dataset.width = '100%'; s.dataset.dark = '1';
    holder.append(s);
  } else if ((host === 'twitter.com' || host === 'x.com') && (m = u.pathname.match(/\/status(?:es)?\/(\d+)/))) {
    loadScript('https://platform.twitter.com/widgets.js')
      .then(() => window.twttr.widgets.createTweet(m[1], holder, { theme: 'dark', dnt: true }))
      .then(r => { if (!r) fallback(url, holder, 'Post unavailable (deleted or private).'); })
      .catch(() => fallback(url, holder));
  } else if ((m = youtubeId(u, host))) {
    const f = document.createElement('iframe');
    f.src = `https://www.youtube-nocookie.com/embed/${m}`;
    f.allow = 'encrypted-media; picture-in-picture; fullscreen'; f.title = 'YouTube video';
    holder.append(f);
  } else {
    fallback(url, holder, 'This site can\'t be embedded.');
  }
  const link = el('a', null, 'Open original ↗'); link.href = url; link.target = '_blank'; link.rel = 'noopener noreferrer';
  const row = el('div', 'row'); row.append(link); holder.append(row);
}

function youtubeId(u, host) {
  if (host === 'youtu.be') return u.pathname.slice(1).match(/^[\w-]{11}/)?.[0];
  if (host === 'youtube.com') return u.searchParams.get('v')?.match(/^[\w-]{11}$/)?.[0] || u.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/)?.[1];
}

function fallback(url, holder, msg) { holder.prepend(el('div', 'warn', msg || 'Couldn\'t load the embed.')); }

// ---------- controls ----------
const slider = document.getElementById('slider');
slider.oninput = () => { day = +slider.value; update(); };
document.getElementById('mode').onchange = update;
document.getElementById('hideGraphic').onchange = update;
document.getElementById('showFront').onchange = update;

let timer = null;
const playBtn = document.getElementById('play');
playBtn.onclick = () => {
  if (timer) { clearInterval(timer); timer = null; playBtn.textContent = '▶'; playBtn.ariaLabel = 'Play timeline'; return; }
  if (day >= +slider.max) day = 0;
  playBtn.textContent = '❚❚'; playBtn.ariaLabel = 'Pause timeline';
  timer = setInterval(() => {
    day = Math.min(day + 7, +slider.max); slider.value = day; update();
    if (day >= +slider.max) playBtn.click();
  }, 250);
};

const info = document.getElementById('info'), toggle = document.getElementById('toggleInfo');
const flip = () => { info.classList.toggle('collapsed'); toggle.setAttribute('aria-expanded', !info.classList.contains('collapsed')); };
toggle.onclick = flip;
toggle.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } };
if (matchMedia('(max-width:640px)').matches) {
  flip();
  // The expanded attribution would cover the timeline on phones; the (i) button still opens it.
  map.once('idle', () => document.querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show'));
}
</script>
</body>
</html>
