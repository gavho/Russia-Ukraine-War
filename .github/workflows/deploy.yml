name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"  # daily data refresh, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Data refresh only on the schedule or a manual run; pushes just rebuild.
      - if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: github.event_name != 'push'
        run: |
          pip install -r scripts/requirements.txt
          python scripts/fetch_data.py
          git add public/data
          if git diff --cached --quiet; then echo "No data changes"; else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update map data $(date -u +%F)"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
